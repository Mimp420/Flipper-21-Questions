name: Build Flipper Zero FAPs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uFBT
        run: python -m pip install --upgrade ufbt

      - name: Build both FAPs
        run: ufbt

      - name: Verify both FAPs exist
        run: |
          test -f dist/twenty_one_questions.fap
          test -f dist/mini_arcade.fap

      - name: Upload 21 Questions
        uses: actions/upload-artifact@v6
        with:
          name: twenty-one-questions-fap
          path: dist/twenty_one_questions.fap
          if-no-files-found: error

      - name: Upload Mini Arcade
        uses: actions/upload-artifact@v6
        with:
          name: mini-arcade-fap
          path: dist/mini_arcade.fap
          if-no-files-found: error
