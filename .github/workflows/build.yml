name: Build Flipper Zero FAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uFBT
        run: python -m pip install --upgrade ufbt

      - name: Build FAP
        run: ufbt

      - name: Verify FAP exists
        run: test -n "$(find dist -maxdepth 1 -name '*.fap' -print -quit)"

      - name: Upload FAP
        uses: actions/upload-artifact@v6
        with:
          name: twenty-one-questions-fap
          path: dist/*.fap
          if-no-files-found: error
