name: Build Flipper Zero FAPs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - directory: "."
            artifact: twenty-one-questions-fap
          - directory: mini_arcade
            artifact: mini-arcade-fap
          - directory: pocket_russell
            artifact: pocket-russell-fap

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uFBT
        run: python -m pip install --upgrade ufbt

      - name: Build FAP
        working-directory: ${{ matrix.app.directory }}
        run: ufbt

      - name: Verify FAP exists
        working-directory: ${{ matrix.app.directory }}
        run: test -n "$(find dist -maxdepth 1 -name '*.fap' -print -quit)"

      - name: Upload FAP
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ matrix.app.directory }}/dist/*.fap
          if-no-files-found: error
